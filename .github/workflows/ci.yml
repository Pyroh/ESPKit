# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Documentation
        run: WARNINGS_AS_ERRORS=1 Tools/build-docs.sh

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
